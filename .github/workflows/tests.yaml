name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m compileall -q custom_components
      - run: node --input-type=module --check < custom_components/idotmatrix/www/idotmatrix-card.js
      - run: bash -n optimize_gifs.sh

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- custom_components/idotmatrix/www/idotmatrix-card.js
